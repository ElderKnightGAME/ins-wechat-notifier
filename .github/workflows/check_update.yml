name: Check Instagram Update

on:
  schedule:
    # 国际标准时间 (UTC)，每 30 分钟运行一次 (对应 cron: '*/30 * * * *')
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允许在 GitHub 页面上随时手动一键点击运行测试

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 Action 保存更新记录回仓库

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Run monitor script
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python monitor.py

      - name: Save state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_post.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last seen post" && git push)
